<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121f3c">
  <title>MuPi Run</title>
  <link rel="icon" href="./icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game" aria-label="MuPi Run">
    <canvas id="world" width="800" height="480" aria-label="Drei Laufspuren mit Hindernissen"></canvas>
    <div class="hud">
      <button id="exit" class="small exit" type="button" aria-label="Spiel verlassen" title="Zurück">‹</button>
      <div class="logo"><span>MuPi</span> RUN</div>
      <div class="scores">
        <div class="score"><span id="distance">0</span><small data-i18n="meters">METER</small></div>
        <div class="best"><small data-i18n="best">REKORD</small><strong id="best">0 m</strong></div>
      </div>
      <button id="pause" class="small pause" type="button" aria-label="Pause" title="Pause">Ⅱ</button>
    </div>
    <div class="controls" aria-label="Touch-Steuerung">
      <div class="control-group">
        <button type="button" id="left" class="pad" aria-label="Links">◀</button>
        <button type="button" id="right" class="pad" aria-label="Rechts">▶</button>
      </div>
      <div class="control-group">
        <button type="button" id="jump" class="pad action jump" aria-label="Springen"><span>↑</span><small data-i18n="jump">SPRUNG</small></button>
        <button type="button" id="duck" class="pad action duck" aria-label="Ducken"><span>↓</span><small data-i18n="duck">DUCKEN</small></button>
      </div>
    </div>
    <section id="overlay" class="overlay" role="dialog" aria-modal="true">
      <div class="panel">
        <div class="kicker" data-i18n="kicker">DAS ENDLOS-ABENTEUER</div>
        <h1 id="headline">MuPi <em>RUN</em></h1>
        <p id="message" data-i18n="intro">Springen, ducken, ausweichen – wie weit kommst du?</p>
        <div class="keyhints">
          <span>◀ ▶ <small data-i18n="lanes">SPUR</small></span>
          <span>A / ↑ <small data-i18n="jump">SPRUNG</small></span>
          <span>B / ↓ <small data-i18n="duck">DUCKEN</small></span>
        </div>
        <button id="primary" type="button" class="primary" data-i18n="start">LOS GEHT'S!</button>
        <p class="hint" data-i18n="controller">Controller empfohlen · Auch mit Touch spielbar</p>
      </div>
    </section>
    <div id="toast" class="toast" aria-live="polite"></div>
  </main>
  <script src="./mupibox-sdk.js"></script>
  <script src="./logic.js"></script>
  <script src="./app.js"></script>
</body>
</html>
